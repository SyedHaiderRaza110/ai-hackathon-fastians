<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FASTIANS — Everything FAST students share, in one place.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --primary:#4f46e5; --primary-2:#6366f1; --primary-dark:#4338ca;
    --ink:#0f172a; --muted:#64748b; --line:#e2e8f0; --bg:#f8fafc; --card:#fff;
    --green:#10b981; --green-bg:#ecfdf5; --green-line:#a7f3d0;
    --red:#f43f5e; --amber:#f59e0b; --violet:#7c3aed;
    --radius:16px;
    --shadow:0 1px 2px rgba(15,23,42,.05),0 10px 28px -14px rgba(15,23,42,.14);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  button{font-family:inherit;cursor:pointer}
  input,select,textarea{font-family:inherit;font-size:15px;color:var(--ink)}
  .hidden{display:none!important}

  /* ---------- Top bar ---------- */
  .topbar{position:sticky;top:0;z-index:60;background:rgba(255,255,255,.92);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
  .topbar-inner{max-width:1120px;margin:0 auto;display:flex;align-items:center;gap:18px;padding:0 20px;height:62px}
  .logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:19px;letter-spacing:-.02em;cursor:pointer}
  .logo-mark{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--primary),var(--violet));color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;box-shadow:0 4px 10px -2px rgba(79,70,229,.5)}
  .logo small{color:var(--muted);font-weight:600;font-size:11px;display:block;line-height:1;margin-top:1px}
  .topnav{display:flex;gap:2px;margin-left:8px}
  .topnav a{padding:8px 12px;border-radius:10px;font-weight:600;font-size:14px;color:var(--muted);position:relative;transition:.15s;cursor:pointer}
  .topnav a:hover{background:#eef2ff;color:var(--primary)}
  .topnav a.active{color:var(--primary);background:#eef2ff}
  .nav-count{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;font-weight:700;margin-left:4px}
  .topbar-right{margin-left:auto;display:flex;align-items:center;gap:10px}
  .user-menu{display:flex;align-items:center;gap:8px}
  .user-chip{display:flex;align-items:center;gap:8px;padding:5px 12px 5px 5px;border-radius:999px;border:1px solid var(--line);background:#fff;cursor:pointer;font-weight:600;font-size:13.5px;transition:.15s}
  .user-chip:hover{border-color:var(--primary-2)}
  .user-name{max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .btn-create{background:var(--primary);color:#fff;border:none;border-radius:12px;padding:9px 15px;font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:6px;transition:.15s;cursor:pointer}
  .btn-create:hover{background:var(--primary-dark);transform:translateY(-1px)}

  /* ---------- Buttons ---------- */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;font-weight:600;font-size:14.5px;padding:10px 16px;border:none;transition:.15s;line-height:1.2;cursor:pointer}
  .btn-primary{background:var(--primary);color:#fff}
  .btn-primary:hover{background:var(--primary-dark)}
  .btn-primary:disabled{background:#c7d2fe;cursor:not-allowed}
  .btn-outline{background:#fff;border:1px solid var(--line);color:var(--ink)}
  .btn-outline:hover{border-color:var(--primary-2);color:var(--primary)}
  .btn-ghost{background:transparent;color:var(--primary)}
  .btn-ghost:hover{background:#eef2ff}
  .btn-danger{background:#fff;border:1px solid #fecdd3;color:var(--red)}
  .btn-danger:hover{background:#fff1f2}
  .btn-sm{padding:7px 12px;font-size:13px;border-radius:10px}
  .btn-lg{padding:13px 22px;font-size:15.5px;border-radius:14px}
  .btn-white{background:#fff;color:var(--primary);font-weight:700}

  /* ---------- Layout ---------- */
  .main{max-width:1120px;margin:0 auto;padding:26px 20px 90px}
  .page-head{margin-bottom:22px}
  .page-head h1{font-size:28px;letter-spacing:-.02em}
  .page-head p{color:var(--muted);margin-top:4px}
  .sec-title{font-size:17px;font-weight:700;margin:30px 0 14px;display:flex;align-items:center;gap:8px}
  .sec-title .count{color:var(--muted);font-weight:600;font-size:14px}

  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
  .muted{color:var(--muted)}
  .small{font-size:12.5px}

  /* ---------- Auth ---------- */
  .auth-wrap{min-height:calc(100vh - 180px);display:flex;align-items:center;justify-content:center;padding:30px 16px}
  .auth-card{width:100%;max-width:430px;background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:30px 26px}
  .auth-logo{display:flex;align-items:center;gap:10px;justify-content:center;font-weight:800;font-size:21px;margin-bottom:4px}
  .auth-tag{text-align:center;color:var(--muted);font-size:13.5px;margin-bottom:18px}
  .auth-tabs{display:flex;gap:6px;background:#f1f5f9;border-radius:12px;padding:4px;margin-bottom:18px}
  .auth-tabs button{flex:1;padding:9px;border:none;border-radius:9px;background:transparent;font-weight:700;font-size:13.5px;color:var(--muted);cursor:pointer;transition:.15s}
  .auth-tabs button.on{background:#fff;color:var(--primary);box-shadow:0 1px 3px rgba(15,23,42,.12)}
  .auth-field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
  .auth-field label{font-weight:600;font-size:12.5px}
  .auth-field input,.auth-field select{border:1px solid var(--line);border-radius:11px;padding:10px 12px;font-size:14.5px;outline:none;background:#fff}
  .auth-field input:focus,.auth-field select:focus{border-color:var(--primary-2);box-shadow:0 0 0 3px rgba(99,102,241,.15)}
  .auth-error{background:#fff1f2;border:1px solid #fecdd3;color:#be123c;border-radius:10px;padding:9px 12px;font-size:13px;font-weight:600;margin-bottom:12px;display:none}
  .auth-divider{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px;margin:18px 0 12px}
  .auth-divider::before,.auth-divider::after{content:'';flex:1;height:1px;background:var(--line)}
  .demo-users{display:flex;flex-direction:column;gap:8px}
  .demo-user{display:flex;align-items:center;gap:10px;padding:9px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;cursor:pointer;transition:.15s;text-align:left}
  .demo-user:hover{border-color:var(--primary-2);background:#eef2ff}
  .demo-user span{font-weight:600;font-size:14px;flex:1}
  .demo-user small{color:var(--muted);font-size:11.5px}
  .auth-hint{text-align:center;color:var(--muted);font-size:12px;margin-top:14px;line-height:1.6}

  /* ---------- Hero ---------- */
  .hero{background:linear-gradient(135deg,#4f46e5 0%,#7c3aed 52%,#db2777 100%);color:#fff;border-radius:24px;padding:52px 44px;position:relative;overflow:hidden}
  .hero::after{content:'';position:absolute;right:-80px;top:-80px;width:280px;height:280px;border-radius:50%;background:rgba(255,255,255,.08)}
  .hero::before{content:'';position:absolute;left:-60px;bottom:-120px;width:260px;height:260px;border-radius:50%;background:rgba(255,255,255,.06)}
  .hero-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.25);padding:6px 12px;border-radius:999px;font-size:13px;font-weight:600;margin-bottom:18px}
  .hero h1{font-size:clamp(28px,4.5vw,44px);font-weight:800;letter-spacing:-.03em;max-width:620px;line-height:1.12}
  .hero p{color:rgba(255,255,255,.85);font-size:16.5px;max-width:520px;margin:14px 0 24px}
  .hero-search{display:flex;gap:8px;max-width:560px;background:#fff;border-radius:14px;padding:6px;box-shadow:0 14px 30px -12px rgba(0,0,0,.35)}
  .hero-search input{flex:1;min-width:0;border:none;outline:none;padding:10px 12px;font-size:15px;background:transparent}
  .hero-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
  .hero-actions button{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);color:#fff;border-radius:12px;padding:9px 14px;font-weight:600;font-size:13.5px;transition:.15s;cursor:pointer}
  .hero-actions button:hover{background:rgba(255,255,255,.24)}
  .hero-trust{margin-top:18px;font-size:13px;color:rgba(255,255,255,.75);display:flex;align-items:center;gap:8px;flex-wrap:wrap}

  /* ---------- Category tiles ---------- */
  .cat-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-top:26px}
  .cat-tile{display:flex;align-items:center;gap:14px;padding:16px;border-radius:16px;background:#fff;border:1px solid var(--line);box-shadow:var(--shadow);transition:.18s;cursor:pointer}
  .cat-tile:hover{transform:translateY(-3px);border-color:var(--primary-2);box-shadow:0 12px 28px -12px rgba(79,70,229,.35)}
  .cat-ico{width:46px;height:46px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:22px;color:#fff;flex-shrink:0}
  .cat-tile b{display:block;font-size:15px}
  .cat-tile span{color:var(--muted);font-size:12.5px}

  /* ---------- Listing cards ---------- */
  .listing-card{overflow:hidden;display:flex;flex-direction:column;transition:.18s;cursor:pointer}
  .listing-card:hover{transform:translateY(-3px);box-shadow:0 16px 34px -16px rgba(15,23,42,.28)}
  .lc-cover{height:118px;display:flex;align-items:center;justify-content:center;font-size:42px;position:relative}
  .lc-cover .lc-type{position:absolute;top:10px;left:10px;background:rgba(255,255,255,.9);color:var(--ink);font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px}
  .lc-save{position:absolute;top:8px;right:8px;background:rgba(255,255,255,.92);border:none;width:30px;height:30px;border-radius:50%;font-size:15px;display:flex;align-items:center;justify-content:center;transition:.15s;box-shadow:0 1px 4px rgba(0,0,0,.15);cursor:pointer}
  .lc-save:hover{transform:scale(1.12)}
  .lc-body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
  .lc-badges{display:flex;gap:6px;flex-wrap:wrap}
  .lc-title{font-size:15.5px;font-weight:700;line-height:1.3}
  .lc-desc{color:var(--muted);font-size:13px;flex:1}
  .lc-meta{display:flex;align-items:center;justify-content:space-between;margin-top:4px}
  .lc-price{font-weight:800;font-size:15px;color:var(--primary)}
  .lc-owner{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);font-weight:600}
  .lc-trust{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:5px}

  /* ---------- Badges ---------- */
  .badge{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px}
  .badge-green{background:var(--green-bg);color:#065f46;border:1px solid var(--green-line)}
  .badge-amber{background:#fffbeb;color:#92400e;border:1px solid #fde68a}
  .badge-blue{background:#eff6ff;color:#1e40af;border:1px solid #bfdbfe}
  .badge-gray{background:#f1f5f9;color:#475569;border:1px solid #e2e8f0}
  .badge-red{background:#fff1f2;color:#be123c;border:1px solid #fecdd3}
  .badge-violet{background:#f5f3ff;color:#6d28d9;border:1px solid #ddd6fe}
  .badge-you{background:#eef2ff;color:var(--primary);border:1px solid #c7d2fe}
  .badge-done{background:var(--green-bg);color:#065f46;border:1px solid var(--green-line)}

  /* ---------- Stars / trust ---------- */
  .stars{color:var(--amber);letter-spacing:1px;font-size:13px}
  .trust-line{display:flex;align-items:center;gap:6px;font-size:14px}
  .verified{display:inline-flex;align-items:center;gap:4px;color:#059669;font-weight:700;font-size:12px}

  /* ---------- Chips / filters ---------- */
  .chip{background:#fff;border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-weight:600;font-size:13.5px;color:var(--muted);transition:.15s;cursor:pointer}
  .chip:hover{border-color:var(--primary-2);color:var(--primary)}
  .chip-on{background:var(--primary);border-color:var(--primary);color:#fff}
  .filter-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
  .filter-row2{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:14px 0 20px}
  .filter-row2 select{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:#fff;font-weight:600;font-size:13.5px;color:var(--ink);outline:none}
  .check{display:inline-flex;align-items:center;gap:7px;font-size:13.5px;font-weight:600;color:var(--muted);cursor:pointer}
  .check input{accent-color:var(--primary);width:16px;height:16px}
  .search-bar{display:flex;gap:8px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:6px;box-shadow:var(--shadow)}
  .search-bar input{flex:1;min-width:0;border:none;outline:none;padding:10px 12px;font-size:15px;background:transparent}
  .result-count{font-size:13px;color:var(--muted);margin:0 0 12px}

  /* ---------- Listing detail ---------- */
  .detail-top{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:24px;margin-top:18px}
  .detail-cover{height:300px;border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:96px;position:relative;overflow:hidden}
  .detail-info h1{font-size:26px;letter-spacing:-.02em;line-height:1.2}
  .detail-price{font-size:22px;font-weight:800;color:var(--primary);margin:10px 0}
  .detail-desc{color:#334155;margin-top:14px;white-space:pre-wrap}
  .provider-card{display:flex;align-items:center;gap:14px;padding:14px;border-radius:14px;border:1px solid var(--line);background:#fff;margin-top:16px}
  .provider-card .p-name{font-weight:700}
  .provider-card .p-sub{color:var(--muted);font-size:13px}
  .cta-box{margin-top:20px;display:flex;flex-direction:column;gap:10px}
  .cta-status{background:#fffbeb;border:1px solid #fde68a;color:#92400e;border-radius:12px;padding:12px 14px;font-size:14px;font-weight:600}
  .cta-closed{background:#f1f5f9;border:1px solid var(--line);color:#475569;border-radius:12px;padding:12px 14px;font-size:14px;font-weight:600}
  .avail-box{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:16px}
  .avail-day{display:flex;justify-content:space-between;font-size:13.5px;padding:5px 0;border-bottom:1px dashed var(--line)}
  .avail-day:last-child{border-bottom:none}
  .avail-day b{font-weight:600}

  /* ---------- Booking ---------- */
  .booking-summary{display:flex;align-items:center;gap:16px;padding:18px;margin:16px 0 22px}
  .booking-summary .bs-cover{width:64px;height:64px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:30px;flex-shrink:0}
  .day-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 6px}
  .slot-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:14px 0}
  .slot{border-radius:12px;padding:14px 10px;font-weight:700;font-size:15px;display:flex;flex-direction:column;align-items:center;gap:3px;border:1px solid transparent;transition:.15s}
  .slot-tag{font-size:11px;font-weight:600}
  .slot.available{background:var(--green-bg);border-color:var(--green-line);color:#065f46}
  .slot.available:hover{border-color:#059669;background:#d1fae5}
  .slot.available.selected{background:var(--primary);border-color:var(--primary);color:#fff}
  .slot.available.selected .slot-tag{color:rgba(255,255,255,.85)}
  .slot.booked{background:#f1f5f9;color:#94a3b8;cursor:not-allowed}
  .slot.mine{background:#eff6ff;border-color:#bfdbfe;color:#1e40af;cursor:not-allowed}
  .booking-foot{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-top:8px}
  .booking-foot #slot-status{font-size:14px;color:var(--muted)}

  /* ---------- Requests / bookings cards ---------- */
  .req-card{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:16px;margin-bottom:12px;flex-wrap:wrap}
  .req-main{display:flex;align-items:center;gap:12px}
  .req-title{font-weight:600;font-size:15px}
  .req-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .contact-reveal{background:#eef2ff;border:1px solid #c7d2fe;color:var(--primary-dark);border-radius:10px;padding:8px 12px;font-size:13px;font-weight:600}
  .bk-card{padding:16px;margin-bottom:12px}
  .bk-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .bk-title{font-weight:700;font-size:15.5px}
  .bk-sub{color:var(--muted);font-size:13px;margin-top:3px}
  .bk-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}

  /* ---------- Dashboard ---------- */
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:8px}
  .stat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow)}
  .stat b{font-size:26px;display:block;letter-spacing:-.02em}
  .stat span{color:var(--muted);font-size:13px;font-weight:600}
  .quick-row{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0 6px}

  /* ---------- Avatar ---------- */
  .avatar{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;color:#fff;font-weight:700;flex-shrink:0}

  /* ---------- Profile ---------- */
  .profile-head{display:flex;align-items:center;gap:20px;padding:24px;margin-bottom:8px;flex-wrap:wrap}
  .profile-head h1{font-size:24px}
  .profile-head .muted{margin-top:2px}

  /* ---------- Review cards ---------- */
  .review-card{padding:16px;margin-bottom:12px}
  .review-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .review-top b{font-size:14.5px}
  .review-comment{margin-top:8px;color:#334155;font-size:14px}
  .review-card .small{margin-top:8px}

  /* ---------- Forms ---------- */
  .form{max-width:640px;padding:26px;display:flex;flex-direction:column;gap:16px}
  .form label{font-weight:600;font-size:13.5px;display:flex;flex-direction:column;gap:6px}
  .form input[type=text],.form input[type=number],.form select,.form textarea{border:1px solid var(--line);border-radius:12px;padding:11px 13px;font-weight:500;outline:none;background:#fff;transition:.15s}
  .form input:focus,.form select:focus,.form textarea:focus{border-color:var(--primary-2);box-shadow:0 0 0 3px rgba(99,102,241,.15)}
  .form textarea{resize:vertical}
  .form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .form-row label{flex-direction:column}
  .form .check{flex-direction:row}
  .form-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:6px}
  .day-checks{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}

  /* ---------- Empty state ---------- */
  .empty{padding:46px 20px;text-align:center;color:var(--muted);border:1.5px dashed var(--line);border-radius:16px;background:#fff}
  .empty .e-ico{font-size:36px;margin-bottom:10px}
  .empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
  .empty-action{text-align:center;margin-top:14px}

  /* ---------- How it works ---------- */
  .steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-top:26px}
  .step{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow)}
  .step .s-num{width:28px;height:28px;border-radius:9px;background:#eef2ff;color:var(--primary);font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center;margin-bottom:10px}
  .step b{font-size:14.5px;display:block;margin-bottom:3px}
  .step p{color:var(--muted);font-size:12.5px}

  /* ---------- CTA banner ---------- */
  .cta-banner{margin-top:30px;background:linear-gradient(135deg,#0f172a,#1e293b);color:#fff;border-radius:20px;padding:30px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
  .cta-banner h3{font-size:20px}
  .cta-banner p{color:#94a3b8;font-size:14px;margin-top:4px}

  /* ---------- Toast ---------- */
  .toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:12px;font-weight:600;font-size:14px;z-index:120;box-shadow:0 12px 30px -8px rgba(0,0,0,.4);animation:toastIn .25s ease;max-width:90vw}
  @keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(12px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}

  /* ---------- Modal ---------- */
  .modal-backdrop{position:fixed;inset:0;background:rgba(15,23,42,.55);display:flex;align-items:center;justify-content:center;z-index:110;padding:20px;animation:fadeIn .18s ease}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  .modal{background:#fff;border-radius:20px;max-width:440px;width:100%;padding:26px;animation:modalIn .2s ease}
  @keyframes modalIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
  .modal h3{font-size:19px;margin-bottom:4px}
  .modal .muted{font-size:13.5px;margin-bottom:14px}
  .star-picker{display:flex;gap:6px;margin:8px 0 14px}
  .sp-star{font-size:32px;color:#cbd5e1;cursor:pointer;transition:.12s;user-select:none}
  .sp-star.on{color:var(--amber)}
  .sp-star:hover{transform:scale(1.15)}
  .modal textarea{border:1px solid var(--line);border-radius:12px;padding:11px 13px;width:100%;outline:none;resize:vertical;min-height:80px}
  .modal textarea:focus{border-color:var(--primary-2)}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:16px}

  /* ---------- Bottom nav (mobile) ---------- */
  .bottomnav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:none;z-index:60;padding-bottom:env(safe-area-inset-bottom)}
  .bottomnav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px;font-size:10px;font-weight:600;color:var(--muted);position:relative;cursor:pointer}
  .bottomnav a .bn-ico{font-size:19px}
  .bottomnav a.active{color:var(--primary)}
  .bn-count{position:absolute;transform:translate(8px,-2px);background:var(--red);color:#fff;font-size:10px;font-weight:700;min-width:16px;height:16px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 4px}

  /* ---------- Footer ---------- */
  .footer{max-width:1120px;margin:0 auto;padding:24px 20px 110px;color:var(--muted);font-size:12.5px;border-top:1px solid var(--line);text-align:center}
  .reset-link{background:none;border:none;color:var(--muted);text-decoration:underline;font-size:12px;cursor:pointer}
  .reset-link:hover{color:var(--primary)}

  /* ---------- Animations ---------- */
  .fade-in{animation:fadeUp .3s ease}
  @keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

  @media(max-width:820px){
    .topnav{display:none}
    .user-name{display:none}
    .btn-create span:last-child{display:none}
    .bottomnav{display:flex}
    .hero{padding:30px 18px;border-radius:20px}
    .hero-search,.search-bar{max-width:100%}
    .hero-search .btn,.search-bar .btn{padding:9px 12px;font-size:13.5px;white-space:nowrap}
    .detail-top{grid-template-columns:1fr}
    .detail-cover{height:200px}
    .form-row{grid-template-columns:1fr}
    .main{padding-top:18px}
  }
  @media(max-width:380px){
    .hero-search .btn,.search-bar .btn{padding:9px 10px;font-size:13px}
    .hero-search input,.search-bar input{padding:10px 8px;font-size:14px}
  }
</style>

<body>
<div id="app"></div>
<script>
/* ============================================================
   FASTIANS — in-memory demo of the student exchange platform
   Login / Sign-up auth + full exchange flow.
   All interaction uses EVENT DELEGATION (data-act attributes).
   ============================================================ */

/* ---------- helpers ---------- */
const now = () => new Date().toISOString();
const daysFromNow = (n) => { const d = new Date(); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); };
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function dayLabel(offset){
  const d = new Date(); d.setDate(d.getDate()+offset);
  if(offset===0) return 'Today';
  if(offset===1) return 'Tomorrow';
  return d.toLocaleDateString('en-US',{weekday:'short'});
}
function fmtDate(iso){ const d = new Date(iso+'T00:00:00'); return d.toLocaleDateString('en-US',{weekday:'short', month:'short', day:'numeric'}); }
function addHour(t){ const [h,m]=t.split(':').map(Number); return String(h+1).padStart(2,'0')+':'+String(m).padStart(2,'0'); }
function overlap(aS,aE,bS,bE){ return aS < bE && aE > bS; }
let counter = 100;
function nextId(p){ return p+'_'+(counter++); }

/* ---------- taxonomy ---------- */
const CATEGORIES = [
  {id:'books', label:'Books', emoji:'📚', grad:'linear-gradient(135deg,#6366f1,#8b5cf6)'},
  {id:'notes', label:'Notes', emoji:'📝', grad:'linear-gradient(135deg,#0ea5e9,#6366f1)'},
  {id:'electronics', label:'Electronics', emoji:'🔌', grad:'linear-gradient(135deg,#f59e0b,#ef4444)'},
  {id:'equipment', label:'Equipment', emoji:'🎒', grad:'linear-gradient(135deg,#10b981,#0ea5e9)'},
  {id:'tutoring', label:'Tutoring', emoji:'🎓', grad:'linear-gradient(135deg,#8b5cf6,#ec4899)'},
  {id:'mentorship', label:'Mentorship', emoji:'🧑‍🏫', grad:'linear-gradient(135deg,#ec4899,#f59e0b)'},
  {id:'services', label:'Services', emoji:'💼', grad:'linear-gradient(135deg,#14b8a6,#6366f1)'},
];
const TYPES = [
  {id:'item', label:'Item'},
  {id:'service', label:'Service'},
  {id:'booking', label:'Booking'},
];
const categoryById = id => CATEGORIES.find(c=>c.id===id) || CATEGORIES[0];
const typeById = id => TYPES.find(t=>t.id===id) || TYPES[0];
const SLOT_TIMES = ['10:00','11:00','12:00','13:00','14:00','15:00','16:00','17:00'];

/* ---------- state ---------- */
const state = {
  loggedIn:false,
  user:null,
  authTab:'signin',
  view:'login',
  params:{},
  search:{ q:'', category:'all', type:'all', price:'all', avail:false, saved:false },
  selectedSlot:null,
  modal:null,
  reviewRating:5,
  reviewTarget:null,
  saved:{},
};
let backStack = [];

/* ---------- seed data ---------- */
let users, listings, bookings, contactRequests, reviews;
function seedData(){
  users = [
    {id:'u_haider', name:'Haider Raza', program:'Computer Science', batch:'2026', color:'#6366f1', rating:4.9, completedExchanges:14, email:'haider.raza@nu.edu.pk', phone:'+92 300 1234567', password:'demo123'},
    {id:'u_ali',    name:'Ali Ahmed',   program:'Computer Science', batch:'2025', color:'#0ea5e9', rating:4.8, completedExchanges:22, email:'ali.ahmed@nu.edu.pk',   phone:'+92 301 2345678', password:'demo123'},
    {id:'u_sara',   name:'Sara Khan',   program:'Software Engineering', batch:'2026', color:'#ec4899', rating:5.0, completedExchanges:9, email:'sara.khan@nu.edu.pk',  phone:'+92 302 3456789', password:'demo123'},
    {id:'u_ahmed',  name:'Ahmed Khan',  program:'Computer Science', batch:'2027', color:'#f59e0b', rating:4.6, completedExchanges:6, email:'ahmed.khan@nu.edu.pk', phone:'+92 303 4567890', password:'demo123'},
    {id:'u_ayesha', name:'Ayesha Malik',program:'Electrical Engineering', batch:'2025', color:'#10b981', rating:4.9, completedExchanges:17, email:'ayesha.malik@nu.edu.pk', phone:'+92 304 5678901', password:'demo123'},
  ];
  const daysAgo = n => new Date(Date.now() - n*86400000).toISOString();
  listings = [
    {id:'l_pf', ownerId:'u_haider', title:'Programming Fundamentals Textbook', type:'item', category:'books', description:'Good condition PF textbook (Deitel). Light highlighting in the first two chapters, otherwise clean. Pickup from the Islamabad campus or I can hand it over in the cafeteria.', price:1500, status:'active', isBookable:false, createdAt:daysAgo(1)},
    {id:'l_oop', ownerId:'u_ayesha', title:'OOP Textbook (2nd Edition)', type:'item', category:'books', description:'Object-Oriented Programming in C++ — very good condition, no torn pages. Selling because I finished the course.', price:1200, status:'active', isBookable:false, createdAt:daysAgo(2)},
    {id:'l_calc', ownerId:'u_ahmed', title:'Scientific Calculator (Casio fx-991)', type:'item', category:'electronics', description:'Casio fx-991EX, works perfectly, new battery. Great for Calculus and DLD exams.', price:2800, status:'active', isBookable:false, createdAt:daysAgo(3)},
    {id:'l_calc_notes', ownerId:'u_sara', title:'Calculus Notes — Full Semester', type:'item', category:'notes', description:'Complete, neatly written Calculus notes with solved practice problems. Free to a good home — just ask nicely.', price:0, status:'active', isBookable:false, createdAt:daysAgo(4)},
    {id:'l_ds_notes', ownerId:'u_ayesha', title:'Data Structures Notes + Past Papers', type:'item', category:'notes', description:'DS notes covering stacks, queues, trees, graphs and past midterm papers with solutions.', price:800, status:'active', isBookable:false, createdAt:daysAgo(5)},
    {id:'l_ds_book', ownerId:'u_haider', title:'Database Systems Textbook', type:'item', category:'books', description:'Database System Concepts (Silberschatz). Slight wear on the cover, all pages intact.', price:1800, status:'active', isBookable:false, createdAt:daysAgo(6)},
    {id:'l_iot', ownerId:'u_ahmed', title:'Arduino Starter Kit', type:'item', category:'electronics', description:'Arduino Uno + breadboard + sensors + jumper wires. Perfect for IoT / embedded projects.', price:4500, status:'active', isBookable:false, createdAt:daysAgo(7)},
    {id:'l_dsa', ownerId:'u_ali', title:'DSA Tutoring — 1-on-1 Sessions', type:'booking', category:'tutoring', description:'Cleared DSA with an A. I tutor 1-on-1: arrays, linked lists, trees, graphs, DP and interview prep. Each session is 1 hour, online or on campus.', price:800, status:'active', isBookable:true, slots:{days:[0,1,2], times:SLOT_TIMES}, createdAt:daysAgo(1)},
    {id:'l_oop_tut', ownerId:'u_ali', title:'OOP Tutoring — Exam Prep', type:'booking', category:'tutoring', description:'Crash course for OOP finals: classes, inheritance, polymorphism, UML. Bring your past papers.', price:700, status:'active', isBookable:true, slots:{days:[1,2,3], times:SLOT_TIMES}, createdAt:daysAgo(2)},
    {id:'l_cv', ownerId:'u_sara', title:'CV Review — 30 min Feedback Call', type:'booking', category:'services', description:'I review your CV and give structured feedback on a 30-minute call. Have interned at a top software house and helped 20+ students polish their CVs.', price:500, status:'active', isBookable:true, slots:{days:[0,1,2], times:SLOT_TIMES}, createdAt:daysAgo(1)},
    {id:'l_react', ownerId:'u_ayesha', title:'React Mentorship — Build a Project', type:'booking', category:'mentorship', description:'Work with me to build a React project end-to-end: components, state, hooks, routing, and deployment. Great for your portfolio.', price:1000, status:'active', isBookable:true, slots:{days:[0,1,2,3], times:SLOT_TIMES}, createdAt:daysAgo(2)},
    {id:'l_mentor', ownerId:'u_haider', title:'Programming Mentorship — Weekly Check-ins', type:'booking', category:'mentorship', description:'Weekly 45-minute check-ins to keep you on track with any programming course or side project. I mentor juniors in my free time.', price:600, status:'active', isBookable:true, slots:{days:[1,2,3], times:SLOT_TIMES}, createdAt:daysAgo(3)},
    {id:'l_gd', ownerId:'u_ahmed', title:'Graphic Design — Posters & Slides', type:'service', category:'services', description:'Posters, event banners, and presentation slides for societies and projects. Fast turnaround, student-friendly rates.', price:1500, status:'active', isBookable:false, createdAt:daysAgo(4)},
  ];
  bookings = [
    {id:'b_1', listingId:'l_dsa', providerId:'u_ali', requesterId:'u_sara', date:daysFromNow(1), startTime:'12:00', endTime:'13:00', status:'confirmed', createdAt:daysAgo(1)},
    {id:'b_2', listingId:'l_react', providerId:'u_ayesha', requesterId:'u_haider', date:daysFromNow(0), startTime:'15:00', endTime:'16:00', status:'confirmed', createdAt:daysAgo(1)},
    {id:'b_3', listingId:'l_cv', providerId:'u_sara', requesterId:'u_ahmed', date:daysFromNow(-2), startTime:'11:00', endTime:'12:00', status:'completed', createdAt:daysAgo(5)},
  ];
  contactRequests = [
    {id:'cr_1', listingId:'l_pf', fromUserId:'u_ahmed', toUserId:'u_haider', status:'pending', createdAt:daysAgo(1)},
    {id:'cr_2', listingId:'l_dsa', fromUserId:'u_sara', toUserId:'u_ali', status:'accepted', createdAt:daysAgo(2)},
  ];
  reviews = [
    {id:'r_1', fromUserId:'u_ahmed', toUserId:'u_haider', listingId:'l_pf', bookingId:null, rating:5, comment:'Exactly as described. Book was in great condition and Haider was super easy to coordinate with.', createdAt:daysAgo(3)},
    {id:'r_2', fromUserId:'u_sara', toUserId:'u_ali', listingId:'l_dsa', bookingId:'b_1', rating:4, comment:'Really helpful session — cleared all my DSA doubts before the quiz.', createdAt:daysAgo(2)},
    {id:'r_3', fromUserId:'u_ahmed', toUserId:'u_sara', listingId:'l_cv', bookingId:'b_3', rating:5, comment:'Great CV feedback! Got an interview call the very next week.', createdAt:daysAgo(4)},
  ];
  state.saved = { u_haider:['l_pf'], u_sara:['l_dsa'] };
}
seedData();

/* ---------- data helpers ---------- */
const userById = id => users.find(u=>u.id===id) || users[0];
const listingById = id => listings.find(l=>l.id===id);
const reviewsFor = uid => reviews.filter(r=>r.toUserId===uid);
function userRating(uid){
  const rs = reviewsFor(uid);
  if(!rs.length) return userById(uid).rating;
  return rs.reduce((s,r)=>s+r.rating,0)/rs.length;
}
function listingSlots(l, date){
  const times = (l.slots && l.slots.times) || SLOT_TIMES;
  return times.map(t=>{
    const end = addHour(t);
    const booked = bookings.some(b=> b.listingId===l.id && b.date===date && (b.status==='confirmed'||b.status==='completed') && overlap(t,end,b.startTime,b.endTime));
    const mine = bookings.some(b=> b.listingId===l.id && b.date===date && b.requesterId===state.user && b.status==='confirmed' && overlap(t,end,b.startTime,b.endTime));
    return {start:t, end, booked, mine};
  });
}
function hasAvailableSlot(l){
  if(!l.isBookable || !l.slots) return false;
  return (l.slots.days||[]).some(d=> listingSlots(l, daysFromNow(d)).some(s=>!s.booked));
}
function incomingRequests(){ return contactRequests.filter(c=>c.toUserId===state.user); }
function outgoingRequests(){ return contactRequests.filter(c=>c.fromUserId===state.user); }
function reviewOpportunities(uid){
  const out=[];
  bookings.filter(b=>b.status==='completed' && (b.requesterId===uid||b.providerId===uid)).forEach(b=>{
    const other = b.requesterId===uid ? b.providerId : b.requesterId;
    if(!reviews.find(r=>r.bookingId===b.id && r.fromUserId===uid))
      out.push({toUserId:other, listingId:b.listingId, bookingId:b.id, label:listingById(b.listingId).title});
  });
  contactRequests.filter(c=>c.status==='completed' && c.fromUserId===uid).forEach(c=>{
    if(!reviews.find(r=>r.bookingId===null && r.listingId===c.listingId && r.toUserId===c.toUserId && r.fromUserId===uid))
      out.push({toUserId:c.toUserId, listingId:c.listingId, bookingId:null, label:listingById(c.listingId).title});
  });
  return out;
}
function isSaved(lid){ return (state.saved[state.user]||[]).includes(lid); }

/* ---------- small components ---------- */
function stars(r){ const full=Math.round(r); return '★'.repeat(full)+'☆'.repeat(5-full); }
function avatar(u,size){ return `<span class="avatar" style="width:${size}px;height:${size}px;background:${u.color};font-size:${size*0.42}px">${esc(u.name.split(' ').map(w=>w[0]).join(''))}</span>`; }
function typeBadge(t){ const tb=typeById(t); return `<span class="badge badge-violet">${tb.label}</span>`; }
function statusBadgeHTML(s){
  const map={active:['badge-green','● Active'],reserved:['badge-amber','◐ Reserved'],completed:['badge-blue','✓ Completed'],cancelled:['badge-gray','✕ Closed'],expired:['badge-gray','Expired']};
  const m=map[s]||map.active;
  return `<span class="badge ${m[0]}">${m[1]}</span>`;
}
function listingCardHTML(l){
  const owner=userById(l.ownerId);
  const c=categoryById(l.category);
  const price = l.price>0 ? 'Rs '+l.price.toLocaleString() : 'FREE';
  const desc = l.description.length>74 ? l.description.slice(0,74)+'…' : l.description;
  return `
  <a class="card listing-card fade-in" data-act="listing" data-id="${l.id}">
    <div class="lc-cover" style="background:${c.grad}"><span>${c.emoji}</span><span class="lc-type">${typeById(l.type).label}</span>
      <button class="lc-save" title="Save" data-act="save" data-id="${l.id}">${isSaved(l.id)?'♥':'♡'}</button>
    </div>
    <div class="lc-body">
      <div class="lc-badges">${statusBadgeHTML(l.status)}${l.isBookable?'<span class="badge badge-green">📅 Bookable</span>':''}${l.ownerId===state.user?'<span class="badge badge-you">You</span>':''}</div>
      <h3 class="lc-title">${esc(l.title)}</h3>
      <p class="lc-desc">${esc(desc)}</p>
      <div class="lc-meta">
        <span class="lc-price">${price}</span>
        <span class="lc-owner">${avatar(owner,20)} ${esc(owner.name.split(' ')[0])}</span>
      </div>
      <div class="lc-trust"><span class="stars">${stars(userRating(owner.id))}</span> ${userRating(owner.id).toFixed(1)} · ${owner.completedExchanges} exchanges</div>
    </div>
  </a>`;
}
function emptyState(icon,title,sub,action){
  return `<div class="empty"><div class="e-ico">${icon}</div><b>${esc(title)}</b>${sub?`<p>${esc(sub)}</p>`:''}${action?`<div class="empty-action">${action}</div>`:''}</div>`;
}
function availabilityPreview(l){
  if(!l.isBookable) return `<div class="avail-box"><div class="avail-day"><b>Availability</b><span class="badge badge-green">Available now</span></div></div>`;
  const days=l.slots.days.slice(0,3);
  const rows=days.map(d=>{
    const date=daysFromNow(d);
    const avail=listingSlots(l,date).filter(s=>!s.booked).length;
    return `<div class="avail-day"><b>${dayLabel(d)}</b><span class="${avail?'':'muted'}">${avail? avail+' slots open':'Fully booked'}</span></div>`;
  }).join('');
  return `<div class="avail-box"><div class="avail-day"><b>Availability</b><span class="badge badge-green">Live slots</span></div>${rows}</div>`;
}

/* ---------- toast / modal ---------- */
let toastTimer;
function toast(msg){
  let el=document.querySelector('.toast');
  if(!el){ el=document.createElement('div'); el.className='toast'; document.body.appendChild(el); }
  el.textContent=msg;
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>{ if(el) el.remove(); },2800);
}
function openReviewModal(toUserId,listingId,bookingId){
  state.modal='review';
  state.reviewTarget={toUserId,listingId,bookingId,label:listingById(listingId).title};
  state.reviewRating=5;
  render({scroll:false});
}
function closeModal(){ state.modal=null; render({scroll:false}); }
function setReviewStars(n){ state.reviewRating=n; const sp=document.getElementById('star-picker'); if(sp){ [...sp.children].forEach((el,i)=>el.classList.toggle('on', i<n)); } }
function submitReview(){
  const t=state.reviewTarget; if(!t) return;
  const rating=state.reviewRating||5;
  const comment=(document.getElementById('review-comment')||{}).value||'';
  reviews.push({id:nextId('r'), fromUserId:state.user, toUserId:t.toUserId, listingId:t.listingId, bookingId:t.bookingId, rating, comment, createdAt:now()});
  state.modal=null;
  toast('Review submitted — thanks for building trust!');
  render();
}

/* ---------- auth ---------- */
function showAuthError(msg){
  const el=document.getElementById('auth-error');
  if(el){ el.style.display='block'; el.textContent=msg; }
}
function doLogin(uid){
  state.loggedIn=true;
  state.user=uid;
  state.authTab='signin';
  toast('Welcome back, '+userById(uid).name.split(' ')[0]+'!');
  go('home');
}
function signIn(){
  const email=(document.getElementById('si-email').value||'').trim().toLowerCase();
  const pass=document.getElementById('si-pass').value||'';
  const u=users.find(x=>x.email.toLowerCase()===email);
  if(!u){ showAuthError('No account found with that email.'); return; }
  if(u.password!==pass){ showAuthError('Incorrect password. Hint: demo123'); return; }
  doLogin(u.id);
}
function signUp(){
  const name=(document.getElementById('su-name').value||'').trim();
  const email=(document.getElementById('su-email').value||'').trim().toLowerCase();
  const pass=document.getElementById('su-pass').value||'';
  const program=document.getElementById('su-program').value;
  const batch=(document.getElementById('su-batch').value||'').trim();
  if(!name){ showAuthError('Please enter your name.'); return; }
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){ showAuthError('Please enter a valid email address.'); return; }
  if(pass.length<6){ showAuthError('Password must be at least 6 characters.'); return; }
  if(users.some(x=>x.email.toLowerCase()===email)){ showAuthError('An account with this email already exists. Sign in instead.'); return; }
  const colors=['#6366f1','#0ea5e9','#ec4899','#f59e0b','#10b981','#8b5cf6','#ef4444'];
  const uid=nextId('u');
  users.push({id:uid, name, email, password:pass, program, batch:batch||'—', color:colors[users.length%colors.length], rating:0, completedExchanges:0, phone:'+92 3XX XXXXXXX'});
  toast('Account created — welcome to FASTIANS!');
  doLogin(uid);
}
function logout(){
  state.loggedIn=false;
  state.user=null;
  state.authTab='signin';
  state.view='login';
  state.params={};
  backStack=[];
  toast('You have been logged out.');
  render();
}

/* ---------- routing (in-memory) ---------- */
function go(view, params){
  backStack.push({view:state.view, params:state.params||{}});
  if(!state.loggedIn && view!=='login'){
    state.view='login'; state.params={}; state.selectedSlot=null; render(); return;
  }
  state.view=view;
  state.params=params||{};
  state.selectedSlot=null;
  render();
}
function goBack(){
  if(backStack.length){
    const prev=backStack.pop();
    state.view=prev.view;
    state.params=prev.params||{};
    state.selectedSlot=null;
    render();
  } else { go('home'); }
}

/* ---------- actions ---------- */
function heroSearch(q){
  state.search={q:(q||'').trim(), category:'all', type:'all', price:'all', avail:false, saved:false};
  go('discover');
}
function goCategory(c){ state.search.category=c; go('discover'); }
function discInput(q){ state.search.q=q; const el=document.getElementById('disc-results'); if(el) el.innerHTML=discoverResultsHTML(); }
function setCat(c){ state.search.category=c; render(); }
function setType(t){ state.search.type=t; render(); }

function requestContact(listingId){
  const l=listingById(listingId);
  const existing=contactRequests.find(c=>c.listingId===listingId && c.fromUserId===state.user && (c.status==='pending'||c.status==='accepted'));
  if(existing){ toast('You already have a request for this listing.'); return; }
  contactRequests.push({id:nextId('cr'), listingId, fromUserId:state.user, toUserId:l.ownerId, status:'pending', createdAt:now()});
  toast('Contact request sent!');
  go('requests');
}
function acceptRequest(id){
  const c=contactRequests.find(x=>x.id===id); if(!c) return;
  c.status='accepted';
  const l=listingById(c.listingId);
  if(l && !l.isBookable && l.status==='active') l.status='reserved';
  toast('Request accepted — contact revealed.');
  render();
}
function declineRequest(id){ const c=contactRequests.find(x=>x.id===id); if(c){ c.status='declined'; toast('Request declined.'); } render(); }
function completeExchange(id){
  const c=contactRequests.find(x=>x.id===id); if(!c) return;
  c.status='completed';
  const l=listingById(c.listingId);
  if(l && !l.isBookable) l.status='completed';
  userById(c.toUserId).completedExchanges += 1;
  toast('Exchange completed — review unlocked!');
  render();
}
function selectSlot(t){ state.selectedSlot = state.selectedSlot===t ? null : t; render({scroll:false}); }
function setBookingDay(d){ state.params.date=daysFromNow(d); state.selectedSlot=null; render(); }
function bookSelected(listingId){
  const l=listingById(listingId);
  const date=state.params.date;
  const start=state.selectedSlot;
  if(!start){ toast('Select an available slot first.'); return; }
  const end=addHour(start);
  const conflict=bookings.some(b=> b.listingId===listingId && b.date===date && (b.status==='confirmed'||b.status==='completed') && overlap(start,end,b.startTime,b.endTime));
  if(conflict){ toast('This slot has already been booked.'); state.selectedSlot=null; render({scroll:false}); return; }
  bookings.push({id:nextId('b'), listingId, providerId:l.ownerId, requesterId:state.user, date, startTime:start, endTime:end, status:'confirmed', createdAt:now()});
  state.selectedSlot=null;
  toast('Slot booked! See it in your Bookings.');
  go('bookings');
}
function cancelBooking(id){ const b=bookings.find(x=>x.id===id); if(b){ b.status='cancelled'; toast('Booking cancelled — slot freed.'); } render(); }
function completeBooking(id){
  const b=bookings.find(x=>x.id===id); if(!b) return;
  b.status='completed';
  userById(b.providerId).completedExchanges += 1;
  toast('Booking completed — review unlocked!');
  render();
}
function closeListing(id){ const l=listingById(id); if(l){ l.status='cancelled'; toast('Listing closed.'); } render(); }
function toggleSave(lid){
  const arr=state.saved[state.user]||(state.saved[state.user]=[]);
  const i=arr.indexOf(lid);
  if(i>=0){ arr.splice(i,1); toast('Removed from saved.'); } else { arr.push(lid); toast('Saved to your dashboard.'); }
  render({scroll:false});
}
function shareListing(id){
  const l=listingById(id);
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText('FASTIANS listing: '+l.title).then(()=>toast('Listing copied to share!')).catch(()=>toast('FASTIANS listing: '+l.title));
  } else { toast('FASTIANS listing: '+l.title); }
}
function submitListing(){
  const id=document.getElementById('cl-id').value;
  const title=document.getElementById('cl-title').value.trim();
  const type=document.getElementById('cl-type').value;
  const category=document.getElementById('cl-category').value;
  const desc=document.getElementById('cl-desc').value.trim();
  const free=document.getElementById('cl-free').checked;
  const price=free?0:(parseInt(document.getElementById('cl-price').value,10)||0);
  const bookable=document.getElementById('cl-bookable').checked;
  const days=[...document.querySelectorAll('.cl-day:checked')].map(x=>parseInt(x.value,10));
  const times=[...document.querySelectorAll('.cl-time:checked')].map(x=>x.value);
  if(!title||!desc){ toast('Title and description are required.'); return; }
  if(bookable && (!days.length||!times.length)){ toast('Select at least one day and one time slot.'); return; }
  if(id){
    const l=listingById(id);
    Object.assign(l,{title,type,category,description:desc,price,isBookable:bookable});
    if(bookable) l.slots={days,times};
    toast('Listing updated.');
    go('listing',{id});
  } else {
    const lid=nextId('l');
    listings.unshift({id:lid, ownerId:state.user, title, type, category, description:desc, price, status:'active', isBookable:bookable, slots:bookable?{days,times}:null, createdAt:now()});
    toast('Listing published!');
    go('listing',{id:lid});
  }
}
function typeChanged(){
  const t=document.getElementById('cl-type').value;
  const wrap=document.getElementById('cl-avail-wrap');
  const bookable=document.getElementById('cl-bookable');
  const days=document.getElementById('cl-avail-days');
  if(t==='booking'){ if(wrap)wrap.classList.remove('hidden'); bookable.checked=true; if(days)days.classList.remove('hidden'); }
  else { bookable.checked=false; if(days)days.classList.add('hidden'); }
}
function bookableToggle(){
  const bookable=document.getElementById('cl-bookable');
  const days=document.getElementById('cl-avail-days');
  if(days) days.classList.toggle('hidden', !bookable.checked);
}
function freeToggle(){
  const price=document.getElementById('cl-price');
  if(price) price.disabled=document.getElementById('cl-free').checked;
}

}

/* ---------- discover results ---------- */
function filteredListings(){
  const {q,category,type,price,avail,saved}=state.search;
  return listings.filter(l=>{
    if(l.status!=='active') return false;
    if(category!=='all' && l.category!==category) return false;
    if(type!=='all' && l.type!==type) return false;
    if(q){ const t=(l.title+' '+l.description+' '+categoryById(l.category).label).toLowerCase(); if(!t.includes(q.toLowerCase())) return false; }
    if(price==='free' && l.price>0) return false;
    if(price==='under1000' && !(l.price>0 && l.price<1000)) return false;
    if(price==='1000to3000' && !(l.price>=1000 && l.price<=3000)) return false;
    if(price==='over3000' && !(l.price>3000)) return false;
    if(avail && (!l.isBookable || !hasAvailableSlot(l))) return false;
    if(saved && !isSaved(l.id)) return false;
    return true;
  });
}
function discoverResultsHTML(){
  const res=filteredListings();
  const total=listings.filter(l=>l.status==='active').length;
  if(!res.length){
    const action=`<button class="btn btn-outline btn-sm" data-act="resetfilters">Clear all filters</button>`;
    return emptyState('🔍','No resources found','Try another keyword or category.',action);
  }
  return `<p class="result-count">Showing ${res.length} of ${total} active listings</p><div class="grid">${res.map(listingCardHTML).join('')}</div>`;
}

function renderListingDetail(l){
  if(!l) return `<div class="fade-in"><button class="btn btn-ghost" data-act="back">← Back</button>${emptyState('🔎','Listing not found','It may have been removed or closed.')}</div>`;
  const owner=userById(l.ownerId);
  const c=categoryById(l.category);
  const price = l.price>0 ? 'Rs '+l.price.toLocaleString() : 'FREE';
  const isOwner = l.ownerId===state.user;
  let cta='';
  if(isOwner){
    cta=`<div class="cta-status">This is your listing.</div>
      <div style="display:flex;gap:10px">
        <button class="btn btn-outline" data-act="edit" data-id="${l.id}">✏️ Edit</button>
        <button class="btn btn-danger" data-act="close" data-id="${l.id}">Close listing</button>
      </div>`;
  } else if(l.status!=='active'){
    cta=`<div class="cta-closed">This listing is no longer available.</div>`;
  } else if(l.isBookable){
    cta=`<button class="btn btn-primary btn-lg" data-act="booking" data-id="${l.id}">📅 Book a Slot</button>
      <p class="muted small">Pick a day and an open slot — booked slots are locked automatically.</p>`;
  } else {
    const cr=contactRequests.find(x=>x.listingId===l.id && x.fromUserId===state.user);
    if(!cr){
      cta=`<button class="btn btn-primary btn-lg" data-act="request" data-id="${l.id}">🤝 Request Contact</button>
        <p class="muted small">The owner approves your request, then contact details are revealed.</p>`;

      cta=`<div class="cta-status">⏳ Contact request pending — the owner hasn't responded yet.</div>`;
    } else if(cr.status==='accepted'){
      cta=`<div class="cta-status">✅ Contact revealed — ${esc(owner.email)} · ${esc(owner.phone)}</div>
        <button class="btn btn-primary" data-act="completex" data-id="${cr.id}">Mark exchange completed</button>`;
    } else if(cr.status==='completed'){
      cta=`<div class="cta-status">✅ Exchange completed. Thanks for using FASTIANS!</div>`;
    } else {
      cta=`<div class="cta-status">✖️ Request declined. You can still browse other listings.</div>`;
    }

  const similar=listings.filter(x=>x.status==='active' && x.category===l.category && x.id!==l.id).slice(0,3);
  return `
  <div class="fade-in">
    <button class="btn btn-ghost" data-act="back">← Back</button>

            <div>

function renderBookingView(l){
  if(!l) return `<div class="fade-in"><button class="btn btn-ghost" data-act="back">← Back</button>${emptyState('🔎','Listing not found','It may have been removed or closed.')}</div>`;
  if(!l.isBookable) return `<div class="fade-in"><button class="btn btn-ghost" data-act="back">← Back</button>${emptyState('📅','This listing is not bookable','Use Request Contact instead.')}</div>`;
  const owner=userById(l.ownerId);
  const days=(l.slots&&l.slots.days)||[0,1,2];
  const selDate=state.params.date||daysFromNow(days[0]);
  const slots=listingSlots(l,selDate);
  const openCount=slots.filter(s=>!s.booked).length;
  const selOffset=days.find(d=>daysFromNow(d)===selDate);
  const selLabel=selOffset!==undefined?dayLabel(selOffset):dayLabel(days[0]);
  const isOwner=l.ownerId===state.user;
  return `
  <div class="fade-in">
    <button class="btn btn-ghost" data-act="back">← Back</button>
    <div class="card booking-summary">
      <div class="bs-cover" style="background:${categoryById(l.category).grad}">${categoryById(l.category).emoji}</div>
      <div style="flex:1">
        <h2>${esc(l.title)}</h2>
        <p class="muted">${esc(owner.name)} · <span class="stars">${stars(userRating(owner.id))}</span> ${userRating(owner.id).toFixed(1)} · ${owner.completedExchanges} exchanges</p>
        <p class="small muted" style="margin-top:4px">${l.price>0?'Rs '+l.price.toLocaleString()+' / session':'Free'}</p>
      </div>
      ${isOwner?'<span class="badge badge-you">Your listing</span>':''}
    </div>
    <h3 class="sec-title">Pick a day</h3>
    <div class="day-tabs">
      ${days.map(d=>`<button class="chip ${selDate===daysFromNow(d)?'chip-on':''}" data-act="day" data-val="${d}">${dayLabel(d)}</button>`).join('')}
    </div>
    <h3 class="sec-title">Available slots <span class="count">· ${openCount} open on ${selLabel}</span></h3>
    <div class="slot-grid">
      ${slots.map(s=>{
        if(s.booked){
          return `<button class="slot ${s.mine?'mine':'booked'}" disabled>${s.start}<span class="slot-tag">${s.mine?'Booked by you':'Booked'}</span></button>`;
        }
        const sel=state.selectedSlot===s.start;
        return `<button class="slot available ${sel?'selected':''}" data-act="slot" data-val="${s.start}">${s.start}<span class="slot-tag">${sel?'Selected':'Available'}</span></button>`;
      }).join('')}
    </div>
    <div class="booking-foot">
      <div id="slot-status">${state.selectedSlot?`Selected: <b>${state.selectedSlot} – ${addHour(state.selectedSlot)}</b>`:'Select an available slot to book.'}</div>
      <button class="btn btn-primary btn-lg" data-act="book" data-id="${l.id}" ${state.selectedSlot?'':'disabled'}>Book Selected Slot</button>
    </div>
    <p class="muted small" style="margin-top:12px">🔒 Booked slots are locked and can't be double-booked — the same slot can't be claimed twice.</p>
  </div>`;
}

    <button class="btn btn-ghost" data-act="back">← Back</button>
    <div class="page-head"><h1>${edit?'Edit listing':'Create a listing'}</h1><p>${edit?'Update your listing details.':'Takes under a minute — no 20-field forms.'}</p></div>
    <form class="card form" id="create-form">
      <input type="hidden" id="cl-id" value="${edit?edit.id:''}">
      <label>Title *
        <input id="cl-title" required value="${edit?esc(edit.title):''}" placeholder="e.g. Programming Fundamentals Textbook">
      </label>
      <div class="form-row">
        <label>Type *
          <select id="cl-type" data-act="cltype">
            ${TYPES.map(t=>`<option value="${t.id}" ${edit&&edit.type===t.id?'selected':''}>${t.label}</option>`).join('')}
          </select>
        </label>
        <label>Category *
          <select id="cl-category">
            ${CATEGORIES.map(c=>`<option value="${c.id}" ${edit&&edit.category===c.id?'selected':''}>${c.emoji} ${c.label}</option>`).join('')}
          </select>
        </label>
      </div>
      <label>Description *
        <textarea id="cl-desc" required rows="3" placeholder="Condition, pickup location, what's included…">${edit?esc(edit.description):''}</textarea>
      </label>
      <div class="form-row">
        <label>Price (Rs)
          <input id="cl-price" type="number" min="0" value="${edit?edit.price:''}" placeholder="0 = free">
        </label>
        <label class="check" style="justify-content:flex-end;align-self:flex-end;padding-bottom:12px"><input type="checkbox" id="cl-free" data-act="free" ${edit&&edit.price===0?'checked':''}> It's free</label>
      </div>
      <div id="cl-avail-wrap" class="${edit&&edit.isBookable?'':'hidden'}">
        <label class="check"><input type="checkbox" id="cl-bookable" data-act="bookable" ${edit&&edit.isBookable?'checked':''}> 📅 Bookable — students book a slot</label>
        <div id="cl-avail-days" class="${edit&&edit.isBookable?'':'hidden'}" style="margin-top:12px">
          <p class="muted small">Available days:</p>
          <div class="day-checks">
            ${[0,1,2,3].map(d=>`<label class="check"><input type="checkbox" class="cl-day" value="${d}" ${!edit||(edit.slots&&edit.slots.days.includes(d))?'checked':''}> ${dayLabel(d)}</label>`).join('')}
          </div>
          <p class="muted small" style="margin-top:10px">Time slots:</p>
          <div class="day-checks">
            ${SLOT_TIMES.map(t=>`<label class="check"><input type="checkbox" class="cl-time" value="${t}" ${!edit||(edit.slots&&edit.slots.times.includes(t))?'checked':''}> ${t}</label>`).join('')}
          </div>
        </div>
      </div>
      <label class="check"><input type="checkbox" id="cl-contact" checked> Allow contact requests</label>
      <div class="form-actions">
        <button type="button" class="btn btn-ghost" data-act="back">Cancel</button>
        <button class="btn btn-primary">${edit?'Save changes':'Publish listing'}</button>
      </div>
    </form>
  </div>`;
}

function requestCardHTML(c){
  const l=listingById(c.listingId);
  const isIncoming=c.toUserId===state.user;
  const other=userById(isIncoming?c.fromUserId:c.toUserId);
  let actions='';
  if(isIncoming && c.status==='pending'){
    actions=`<button class="btn btn-primary btn-sm" data-act="accept" data-id="${c.id}">Accept</button><button class="btn btn-outline btn-sm" data-act="decline" data-id="${c.id}">Decline</button>`;
  } else if(c.status==='accepted'){
    const contact=userById(isIncoming?c.fromUserId:c.toUserId);
    actions=`<div class="contact-reveal">📧 ${esc(contact.email)} · 📱 ${esc(contact.phone)}</div>`;
    actions+=`<button class="btn btn-primary btn-sm" data-act="completex" data-id="${c.id}">Mark exchange completed</button>`;
  } else if(c.status==='completed'){
    actions=`<span class="badge badge-done">Exchange completed ✓</span>`;
  } else if(c.status==='declined'){
    actions=`<span class="badge badge-gray">Declined</span>`;
  }
  return `
  <div class="card req-card">
    <div class="req-main">
      ${avatar(other,40)}
      <div>
        <div class="req-title">${esc(other.name)} <span class="muted">· ${esc(l?l.title:'Listing')}</span></div>
        <div class="muted small">${c.status==='pending'?'⏳ Pending':c.status==='accepted'?'✅ Accepted':'—'}</div>
      </div>
    </div>
    <div class="req-actions">${actions}</div>
  </div>`;
}

function renderRequests(){
  const inc=incomingRequests();
  const out=outgoingRequests();
  const exploreAction=`<button class="btn btn-primary btn-sm" data-act="nav" data-val="discover">Explore listings</button>`;
  return `
  <div class="page-head fade-in"><h1>Requests</h1><p>Connect with other students — no full messaging needed.</p></div>
  <h2 class="sec-title">Incoming <span class="count">(${inc.length})</span></h2>
  ${inc.length?inc.map(requestCardHTML).join(''):emptyState('📥','No incoming requests yet','When a student requests your contact, it appears here.',exploreAction)}
  <h2 class="sec-title">Outgoing <span class="count">(${out.length})</span></h2>
  ${out.length?out.map(requestCardHTML).join(''):emptyState('📤','You have not sent any requests','Request contact from any listing to get started.',exploreAction)}`;
}

function bookingCardHTML(b){
  const l=listingById(b.listingId);
  const isProvider=b.providerId===state.user;
  const other=userById(isProvider?b.requesterId:b.providerId);
  const role=isProvider?'Providing':'Requesting';
  let actions='';
  if(b.status==='confirmed'){
    actions=`<button class="btn btn-outline btn-sm" data-act="cancelbook" data-id="${b.id}">Cancel</button>`;
    if(isProvider) actions+=`<button class="btn btn-primary btn-sm" data-act="completebook" data-id="${b.id}">Mark completed</button>`;
  } else if(b.status==='completed'){
    const opp=reviewOpportunities(state.user).find(o=>o.bookingId===b.id);
    if(opp) actions+=`<button class="btn btn-primary btn-sm" data-act="review" data-to="${opp.toUserId}" data-listing="${opp.listingId}" data-booking="${opp.bookingId}">★ Leave review</button>`;
    actions+=`<span class="badge badge-done">Completed</span>`;
  } else if(b.status==='cancelled'){
    actions=`<span class="badge badge-gray">Cancelled</span>`;
  }
  return `
  <div class="card bk-card">
    <div class="bk-head">
      <div>
        <div class="bk-title">${esc(l?l.title:'Listing')}</div>
        <div class="bk-sub">${role} · with ${esc(other.name)} · ${fmtDate(b.date)}, ${b.startTime}–${b.endTime}</div>
      </div>
      <div>${b.status==='confirmed'?'<span class="badge badge-green">Confirmed</span>':''}</div>
    </div>
    <div class="bk-actions">${actions}</div>
  </div>`;
}

function renderBookings(){
  const mine=bookings.filter(b=>b.requesterId===state.user||b.providerId===state.user);
  const upcoming=mine.filter(b=>b.status==='confirmed');
  const completed=mine.filter(b=>b.status==='completed');
  const cancelled=mine.filter(b=>b.status==='cancelled');
  const browseAction=`<button class="btn btn-primary btn-sm" data-act="browsebookable">Browse bookable slots</button>`;
  return `
  <div class="page-head fade-in"><h1>Bookings</h1><p>Your scheduled sessions and their status.</p></div>
  <h2 class="sec-title">Upcoming <span class="count">(${upcoming.length})</span></h2>
  ${upcoming.length?upcoming.map(bookingCardHTML).join(''):emptyState('📅','No upcoming bookings','Book a slot from any bookable listing.',browseAction)}
  <h2 class="sec-title">Completed <span class="count">(${completed.length})</span></h2>
  ${completed.length?completed.map(bookingCardHTML).join(''):emptyState('✅','Nothing completed yet','Completed sessions show up here with review buttons.')}
  <h2 class="sec-title">Cancelled <span class="count">(${cancelled.length})</span></h2>
  ${cancelled.length?cancelled.map(bookingCardHTML).join(''):'<p class="muted small">No cancelled bookings.</p>'}`;
}

function renderDashboard(){
  const me=userById(state.user);
  const myListings=listings.filter(l=>l.ownerId===state.user);
  const myBookings=bookings.filter(b=>b.requesterId===state.user||b.providerId===state.user);
  const pendingReq=incomingRequests().filter(c=>c.status==='pending');
  const completedCount=myBookings.filter(b=>b.status==='completed').length + contactRequests.filter(c=>c.status==='completed'&&c.fromUserId===state.user).length;
  const opps=reviewOpportunities(state.user);
  const savedIds=state.saved[state.user]||[];
  const savedListings=savedIds.map(listingById).filter(Boolean);
  return `
  <div class="page-head fade-in"><h1>Dashboard</h1><p>Welcome back, ${esc(me.name.split(' ')[0])}.</p></div>
  <div class="quick-row">
    <button class="btn btn-primary" data-act="create">+ Create listing</button>
    <button class="btn btn-outline" data-act="nav" data-val="requests">🤝 Requests (${pendingReq.length})</button>
    <button class="btn btn-outline" data-act="nav" data-val="bookings">📅 Bookings (${myBookings.filter(b=>b.status==='confirmed').length})</button>
    <button class="btn btn-outline" data-act="nav" data-val="discover">🔍 Discover</button>
  </div>
  <div class="stats">
    <div class="stat"><b>${myListings.length}</b><span>My listings</span></div>
    <div class="stat"><b>${myBookings.filter(b=>b.status==='confirmed').length}</b><span>Active bookings</span></div>
    <div class="stat"><b>${pendingReq.length}</b><span>Pending requests</span></div>
    <div class="stat"><b>${completedCount}</b><span>Completed exchanges</span></div>
    <div class="stat"><b>${userRating(state.user).toFixed(1)}</b><span>My rating</span></div>
  </div>

  ${opps.length?`
  <h2 class="sec-title">⭐ Ready to review</h2>
  ${opps.map(o=>`
    <div class="card req-card">
      <div class="req-main">
        ${avatar(userById(o.toUserId),40)}
        <div><div class="req-title">Leave a review for ${esc(userById(o.toUserId).name.split(' ')[0])}</div><div class="muted small">${esc(o.label)}</div></div>
      </div>
      <div class="req-actions"><button class="btn btn-primary btn-sm" data-act="review" data-to="${o.toUserId}" data-listing="${o.listingId}" data-booking="${o.bookingId}">★ Leave review</button></div>
    </div>`).join('')}`:''}

  <h2 class="sec-title">My listings <span class="count">(${myListings.length})</span></h2>
  ${myListings.length?`<div class="grid">${myListings.map(listingCardHTML).join('')}</div>`:emptyState('📦','You have not created any listings yet','Share something with your campus.',`<button class="btn btn-primary btn-sm" data-act="create">+ Create Listing</button>`)}

  <h2 class="sec-title">My bookings <span class="count">(${myBookings.length})</span></h2>
  ${myBookings.length?myBookings.map(bookingCardHTML).join(''):emptyState('📅','No bookings yet','Book a slot from any bookable listing.',`<button class="btn btn-primary btn-sm" data-act="browsebookable">Browse bookable slots</button>`)}

  <h2 class="sec-title">Incoming requests <span class="count">(${incomingRequests().length})</span></h2>
  ${incomingRequests().length?incomingRequests().map(requestCardHTML).join(''):emptyState('📥','No incoming requests','When someone requests your contact, accept or decline here.')}

  ${savedListings.length?`<h2 class="sec-title">Saved <span class="count">(${savedListings.length})</span></h2><div class="grid">${savedListings.map(listingCardHTML).join('')}</div>`:''}`;
}

function renderProfile(uid){
  const u=userById(uid);
  if(!users.find(x=>x.id===uid)) return `<div class="fade-in"><button class="btn btn-ghost" data-act="back">← Back</button>${emptyState('👤','User not found','This profile does not exist.')}</div>`;
  const revs=reviewsFor(uid);
  const uListings=listings.filter(l=>l.ownerId===uid && l.status!=='cancelled');
  const rating=userRating(uid);
  const isSelf=uid===state.user;
  return `
  <div class="fade-in">
    <button class="btn btn-ghost" data-act="back">← Back</button>
    <div class="card profile-head">
      ${avatar(u,72)}
      <div style="flex:1">
        <h1>${esc(u.name)} ${isSelf?'<span class="badge badge-you">You</span>':''}</h1>
        <p class="muted">${esc(u.program)} · Batch ${u.batch} · <span class="verified">✓ FAST Student</span></p>
        ${isSelf?`<p class="muted small" style="margin-top:4px">${esc(u.email)} · ${esc(u.phone)}</p>`:''}
        <div class="trust-line" style="margin-top:8px"><span class="stars" style="font-size:17px">${stars(rating)}</span> <b style="font-size:17px">${rating.toFixed(1)}</b> <span class="muted">· ${u.completedExchanges} completed exchanges</span></div>
      </div>
      ${isSelf?`<button class="btn btn-outline" data-act="create">+ Create listing</button>`:''}
    </div>
    <h2 class="sec-title">Reviews <span class="count">(${revs.length})</span></h2>
    ${revs.length?revs.map(r=>{
      const from=userById(r.fromUserId);
      return `<div class="card review-card">
        <div class="review-top">${avatar(from,28)} <b>${esc(from.name)}</b> <span class="stars">${stars(r.rating)}</span> <span class="muted small">${r.rating}.0</span></div>
        ${r.comment?`<p class="review-comment">"${esc(r.comment)}"</p>`:''}
        <div class="muted small">on ${esc(listingById(r.listingId)?listingById(r.listingId).title:'exchange')}</div>
      </div>`;
    }).join(''):emptyState('💬','No reviews yet','Reviews unlock after completed exchanges.')}
    <h2 class="sec-title">Active listings <span class="count">(${uListings.length})</span></h2>
    ${uListings.length?`<div class="grid">${uListings.map(listingCardHTML).join('')}</div>`:emptyState('📦','No active listings')}
  </div>`;
}

/* ---------- shell ---------- */
function topbarHTML(){
  const u=userById(state.user);
  const reqCount=incomingRequests().filter(c=>c.status==='pending').length;
  const bkCount=bookings.filter(b=>b.status==='confirmed'&&(b.requesterId===state.user||b.providerId===state.user)).length;
  const nav=[['home','Home'],['discover','Discover'],['bookings','Bookings',bkCount],['requests','Requests',reqCount],['dashboard','Dashboard'],['profile','Profile']];
  return `
  <header class="topbar">
    <div class="topbar-inner">
      <a class="logo" data-act="nav" data-val="home"><span class="logo-mark">F</span><span>FASTIANS<small>student exchange</small></span></a>
      <nav class="topnav">
        ${nav.map(([v,label,count])=>`<a class="${state.view===v?'active':''}" data-act="nav" data-val="${v}">${label}${count?`<span class="nav-count">${count}</span>`:''}</a>`).join('')}
      </nav>
      <div class="topbar-right">
        <div class="user-menu">
          <a class="user-chip" data-act="nav" data-val="profile" title="Your profile">${avatar(u,30)}<span class="user-name">${esc(u.name.split(' ')[0])}</span></a>
          <button class="btn btn-outline btn-sm" data-act="logout">Log out</button>
        </div>
        <button class="btn-create" data-act="create"><span>+</span><span>Create Listing</span></button>
      </div>
    </div>
  </header>`;
}
function bottomnavHTML(){
  const reqCount=incomingRequests().filter(c=>c.status==='pending').length;
  const bkCount=bookings.filter(b=>b.status==='confirmed'&&(b.requesterId===state.user||b.providerId===state.user)).length;
  const items=[['home','🏠','Home'],['discover','🔍','Discover'],['bookings','📅','Bookings'],['requests','🤝','Requests'],['dashboard','📊','Dashboard'],['profile','👤','Profile']];
  return `
  <nav class="bottomnav">
    ${items.map(([v,ico,label])=>{
      const count=v==='requests'?reqCount:(v==='bookings'?bkCount:0);
      return `<a class="${state.view===v?'active':''}" data-act="nav" data-val="${v}"><span class="bn-ico">${ico}${count?`<span class="bn-count">${count}</span>`:''}</span>${label}</a>`;
    }).join('')}
  </nav>`;
}

function viewContent(){
  if(!state.loggedIn && state.view!=='login') return renderLogin();
  switch(state.view){
    case 'login': return renderLogin();
    case 'discover': return renderDiscover();
    case 'listing': return renderListingDetail(listingById(state.params.id));
    case 'booking': return renderBookingView(listingById(state.params.id));
    case 'create': return renderCreateListing();
    case 'bookings': return renderBookings();
    case 'requests': return renderRequests();
    case 'dashboard': return renderDashboard();
    case 'profile': return renderProfile(state.params.id||state.user);
    default: return renderHome();
  }
}

function render(opts={}){
  if(opts.scroll!==false) window.scrollTo({top:0});
  const app=document.getElementById('app');
  let content;
  try { content=viewContent(); } catch(err){ console.error(err); content=emptyState('⚠️','Something went wrong', (err&&err.message)||String(err)); }
  const modal=state.modal==='review'?reviewModalHTML():'';
  const showShell=state.loggedIn;
  app.innerHTML=`
    ${showShell?topbarHTML():''}
    <main class="main">${content}</main>
    ${showShell?bottomnavHTML():''}
    ${modal}
    <div id="err-box" style="display:none;max-width:1120px;margin:0 auto;padding:10px 20px;background:#fff1f2;color:#be123c;border-radius:10px;font-size:13px"></div>
    <footer class="footer">FASTIANS — independent student project for hackathon purposes. Not affiliated with or endorsed by FAST-NUCES.<br><button class="reset-link" data-act="resetdemo">Reset demo data</button></footer>`;
  if(state.view==='discover'){ const q=document.getElementById('disc-q'); if(q) q.value=state.search.q; }
}

function reviewModalHTML(){
  const t=state.reviewTarget;
  if(!t) return '';
  const u=userById(t.toUserId);
  return `
  <div class="modal-backdrop" data-act="closemodal">
    <div class="modal">
      <h3>Leave a review</h3>
      <p class="muted">For ${esc(u.name)} · ${esc(t.label)}</p>
      <div class="star-picker" id="star-picker">
        ${[1,2,3,4,5].map(n=>`<span class="sp-star ${n<=state.reviewRating?'on':''}" data-act="reviewstar" data-val="${n}">★</span>`).join('')}
      </div>
      <textarea id="review-comment" placeholder="How was the exchange? (optional)"></textarea>
      <div class="modal-actions">
        <button class="btn btn-ghost" data-act="closemodal">Cancel</button>
        <button class="btn btn-primary" data-act="submitreview">Submit review</button>
      </div>
    </div>
  </div>`;
}

/* ---------- EVENT DELEGATION (no inline handlers) ---------- */
document.addEventListener('click', function(e){
  const el=e.target.closest('[data-act]');
  if(!el) return;
  const act=el.dataset.act, val=el.dataset.val, id=el.dataset.id;
  switch(act){
    case 'nav': go(val); break;
    case 'back': goBack(); break;
    case 'create': go('create'); break;
    case 'listing': go('listing',{id:id}); break;
    case 'profile': go('profile',{id:id}); break;
    case 'booking': go('booking',{id:id}); break;
    case 'edit': go('create',{id:id}); break;
    case 'cat': setCat(val); break;
    case 'gocat': state.search.category=val; go('discover'); break;
    case 'savedfilter': toggleSavedFilter(); break;
    case 'resetfilters': resetFilters(); break;
    case 'search': { const inp=document.getElementById('disc-q'); discInput(inp?inp.value:''); break; }
    case 'herosearch': heroSearch(document.getElementById('hero-q').value); break;
    case 'save': toggleSave(id); break;
    case 'share': shareListing(id); break;
    case 'request': requestContact(id); break;
    case 'accept': acceptRequest(id); break;
    case 'decline': declineRequest(id); break;
    case 'completex': completeExchange(id); break;
    case 'slot': selectSlot(val); break;
    case 'day': setBookingDay(parseInt(val,10)); break;
    case 'book': bookSelected(id); break;
    case 'cancelbook': cancelBooking(id); break;
    case 'completebook': completeBooking(id); break;
    case 'close': closeListing(id); break;
    case 'review': openReviewModal(el.dataset.to, el.dataset.listing, el.dataset.booking); break;
    case 'reviewstar': setReviewStars(parseInt(val,10)); break;
    case 'submitreview': submitReview(); break;
    case 'closemodal': if(e.target===el) closeModal(); break;
    case 'browsebookable': browseBookable(); break;
    case 'resetdemo': resetDemo(); break;
    case 'authtab': state.authTab=val; render({scroll:false}); break;
    case 'signin': signIn(); break;
    case 'signup': signUp(); break;
    case 'quicklogin': doLogin(id); break;
    case 'logout': logout(); break;
  }
});
document.addEventListener('change', function(e){
  const el=e.target;
  if(!el.dataset) return;
  const act=el.dataset.act;
  if(act==='type') setType(el.value);
  else if(act==='price') setPrice(el.value);
  else if(act==='avail') setAvail(el.checked);
  else if(act==='free') freeToggle();
  else if(act==='bookable') bookableToggle();
  else if(act==='cltype') typeChanged();
});
document.addEventListener('input', function(e){
  if(e.target.id==='disc-q') discInput(e.target.value);
});
document.addEventListener('keydown', function(e){
  if(e.key==='Enter'){
    if(e.target.id==='hero-q') heroSearch(e.target.value);
    if(e.target.id==='disc-q') discInput(e.target.value);
  }
  if(e.key==='Escape' && state.modal) closeModal();
});
document.addEventListener('submit', function(e){
  if(e.target.id==='create-form'){ e.preventDefault(); submitListing(); }
  if(e.target.id==='signin-form'){ e.preventDefault(); signIn(); }
  if(e.target.id==='signup-form'){ e.preventDefault(); signUp(); }
});
window.addEventListener('error', function(e){
  const box=document.getElementById('err-box');
  if(box){ box.style.display='block'; box.textContent='⚠️ '+(e.message||'Unknown error'); }
});

/* ---------- boot ---------- */
render();
</script>
</body>
</html>
